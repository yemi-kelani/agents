name: PR Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Fork pull requests cannot be reviewed by this job and must not be failed
    # by it. GitHub withholds secrets from a fork's `pull_request` run and
    # downgrades GITHUB_TOKEN to read-only, so the reviewer would have no model
    # key to call and no write access to post with — a red check on every
    # external contribution. Skipping is the honest outcome; reviewing forks
    # needs a `workflow_run` job that runs after this one, with the secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Backstop: the reviewer bounds its own model calls and HTTP, but a job-level
    # limit is what guarantees a hung run cannot hold a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff is taken between the base and head SHAs, so both commits
          # have to be present. The default shallow clone does not have them.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install the codex CLI
        # A hard dependency: llm.py shells out to `codex`, which is not present
        # on the runner image. Pinned so a CLI release cannot change the output
        # contract underneath us.
        run: npm install -g @openai/codex@0.153.4

      - name: Run the reviewer
        working-directory: pr-reviewer/src
        env:
          # Diffing by SHA rather than by `origin/<branch>`: a head branch does
          # not always have a ref under `origin`, but its head commit is fetched
          # and present. (This alone does not make forks reviewable — see the
          # job-level `if` above for why those are skipped outright.)
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

          # Branch names are used for logging and for the review body. Actions
          # sets GITHUB_HEAD_REF/GITHUB_BASE_REF itself on a pull_request event,
          # so nothing needs mapping by hand.

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          MAX_REVIEWS_PER_PR: "1"
        run: python main.py
